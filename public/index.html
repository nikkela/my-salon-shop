<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Book haircuts, hair spa, facials, threading, bridal makeup and mehendi online in seconds." />
  <title>Saundarya Salon & Spa</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a href="#/" class="brand" aria-label="Home">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c2.8 3.2 4.2 6.2 4.2 9a4.2 4.2 0 1 1-8.4 0C7.8 8.2 9.2 5.2 12 2Zm-7 13.5c2.2.2 4 1 5.3 2.4A6.5 6.5 0 0 1 12 22a6.5 6.5 0 0 1 1.7-4.1c1.3-1.4 3.1-2.2 5.3-2.4-.3 3.5-3.4 6.5-7 6.5s-6.7-3-7-6.5Z"/></svg>
        <span data-salon-name>Saundarya</span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="#/services">Services</a>
        <a href="#/team">Team</a>
        <a href="#/visit">Visit</a>
        <a href="#/book">Book</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
      <button class="nav-burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer" id="footer">
    <div class="wrap footer-grid">
      <div>
        <strong data-salon-name>Saundarya Salon & Spa</strong>
        <p class="muted" id="footAddress"></p>
      </div>
      <div class="footer-links">
        <a href="#/services">Services</a><a href="#/team">Team</a><a href="#/visit">Hours &amp; location</a><a href="#/account">My bookings</a>
      </div>
      <p class="muted small" id="footCopy"></p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="/app.js"></script>
</body>
</html>
